version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    restart: always

  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb+srv://tyty:123@tyty.kennvuf.mongodb.net/purely_auth_service?retryWrites=true&w=majority&appName=tyty
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    restart: always

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb+srv://tyty:123@tyty.kennvuf.mongodb.net/purely_cart_service?retryWrites=true&w=majority&appName=tyty
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672
    restart: always

volumes:
  mongo_data:

networks:
  default:
    name: fastfood_network
